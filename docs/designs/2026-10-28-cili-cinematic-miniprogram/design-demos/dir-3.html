<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C · 路线海报 — CILI CINEMA 小程序方向稿</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    :root{--paper:#f2ead9;--white:#fffdf7;--ink:#181817;--red:#b92b18;--yellow:#e8b829;--blue:#3f708d;--muted:#6d665c;--line:#181817}
    *{box-sizing:border-box}html,body,#root{margin:0;min-height:100%;background:#efe7d6}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink)}button,input{font:inherit}
    .board{width:1800px;height:1200px;position:relative;overflow:hidden;background:var(--paper)}.board-art{position:absolute;left:-120px;top:-150px;width:720px;height:720px;border-radius:50%;background:conic-gradient(var(--red) 0 25%,var(--ink) 25% 58%,var(--yellow) 58% 80%,var(--blue) 80% 100%);opacity:.95}.board-art:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:var(--paper);left:160px;top:150px}.board-grid{position:absolute;right:0;bottom:0;width:760px;height:520px;background:repeating-linear-gradient(0deg,transparent 0 39px,rgba(24,24,23,.1) 40px),repeating-linear-gradient(90deg,transparent 0 39px,rgba(24,24,23,.1) 40px)}
    .board-head{position:absolute;left:650px;top:58px;width:730px}.direction{font:900 14px ui-monospace,monospace;letter-spacing:.23em;color:var(--red)}.board h1{font:900 72px/1.05 "Songti SC",STSong,serif;margin:15px 0}.board-copy{font-size:18px;line-height:1.7;max-width:700px}.palette{position:absolute;right:65px;top:64px;display:flex;gap:9px}.palette i{width:24px;height:72px;background:var(--red)}.palette i:nth-child(2){background:var(--ink);height:54px}.palette i:nth-child(3){background:var(--yellow);height:38px}.palette i:nth-child(4){background:var(--blue);height:26px}
    .phone-pos{position:absolute;z-index:3}.p1{left:65px;top:430px;transform:rotate(-3deg)}.p2{left:365px;top:325px;transform:rotate(1.5deg)}.p3{left:718px;top:260px}.p4{left:1095px;top:340px;transform:rotate(-1.5deg)}.p5{left:1455px;top:445px;transform:rotate(3deg)}.phone-label{display:inline-block;background:var(--ink);color:white;padding:6px 10px;margin:0 0 8px 10px;font:800 11px ui-monospace,monospace;letter-spacing:.12em}.phone-label b{color:var(--yellow)}
    .screen{height:100%;background:var(--paper);position:relative;overflow:hidden}.app{height:100%;overflow:auto;padding-bottom:64px}.app::-webkit-scrollbar{display:none}.nav{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 15px}.brand{display:flex;align-items:center;gap:8px;font-weight:900}.brand img{width:34px;height:34px}.capsule{width:65px;height:27px;border:1px solid var(--ink);border-radius:99px;display:grid;place-items:center;letter-spacing:3px}.poster{height:270px;position:relative;overflow:hidden;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);background:var(--yellow)}.geo-a{position:absolute;width:200px;height:200px;border-radius:50%;background:var(--red);left:-34px;top:-35px}.geo-a:after{content:"";position:absolute;width:95px;height:95px;border-radius:50%;background:var(--paper);left:57px;top:54px}.geo-b{position:absolute;width:190px;height:210px;background:var(--ink);right:-52px;bottom:-58px;border-radius:100% 0 0 0}.geo-c{position:absolute;width:88px;height:88px;background:var(--blue);left:116px;top:108px;border-radius:0 0 88px 0}.route{position:absolute;inset:18px}.route svg{width:100%;height:100%}.poster-copy{position:absolute;z-index:2;left:18px;bottom:16px}.poster-copy .date{font:900 10px ui-monospace,monospace;letter-spacing:.17em}.poster-copy h2{font:900 37px/1 "Songti SC",serif;margin:5px 0}.poster-no{position:absolute;right:15px;top:13px;font:900 42px ui-monospace,monospace;color:var(--paper)}.metricbar{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:2px solid var(--ink)}.metric{padding:12px 10px;border-right:1px solid var(--ink)}.metric:last-child{border-right:0}.metric b{font:900 22px ui-monospace,monospace}.metric span{display:block;font-size:10px;margin-top:2px;color:var(--muted)}.content{padding:16px}.title-row{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:12px}.title-row h3{font-size:19px;margin:0}.title-row span{font:800 10px ui-monospace,monospace;color:var(--red)}.event{display:grid;grid-template-columns:96px 1fr;border:1px solid var(--ink);margin-top:10px;background:var(--white)}.event-geo{min-height:104px;background:linear-gradient(135deg,var(--red) 0 42%,var(--paper) 42% 55%,var(--blue) 55% 100%);border-right:1px solid var(--ink)}.event-copy{padding:12px}.event-copy b{font:900 18px "Songti SC",serif}.small{font-size:10px;line-height:1.5;color:var(--muted)}.btn{min-height:48px;width:100%;border:1px solid var(--ink);background:var(--ink);color:white;font-weight:900;margin-top:13px}.btn.red{background:var(--red);border-color:var(--red)}.section{margin:18px 0}.sec-head{display:grid;grid-template-columns:42px 1fr;gap:9px;align-items:center;margin-bottom:8px}.sec-head i{height:24px;background:var(--red);color:white;display:grid;place-items:center;font:900 10px ui-monospace,monospace;font-style:normal}.sec-head b{font-size:17px}.rows{border-top:1px solid var(--ink)}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--ink);font-size:12px}.row b{text-align:right}.route-card{height:100px;background:var(--ink);position:relative;overflow:hidden}.route-card svg{width:100%;height:100%}.steps{display:flex;border:1px solid var(--ink);margin-bottom:13px}.step{flex:1;text-align:center;padding:9px 3px;font-size:9px;border-right:1px solid var(--ink)}.step:last-child{border-right:0}.step.on{background:var(--yellow);font-weight:900}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}.field input{width:100%;height:43px;background:var(--white);border:1px solid var(--ink);padding:0 10px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:7px}.choice button{height:43px;background:var(--white);border:1px solid var(--ink)}.choice .on{background:var(--yellow);border-width:2px}.note{border-left:8px solid var(--red);padding:8px 10px;background:var(--white);font-size:10px;line-height:1.5}.ticket{border:2px solid var(--ink);background:var(--white)}.ticket-art{height:115px;position:relative;background:linear-gradient(90deg,var(--yellow) 0 38%,var(--ink) 38% 70%,var(--red) 70%)}.ticket-art:after{content:"";position:absolute;width:76px;height:76px;border-radius:50%;background:var(--paper);left:26px;top:20px}.ticket-art b{position:absolute;right:14px;bottom:11px;color:white;font:900 29px "Songti SC",serif}.ticket-body{padding:14px}.time{font:900 40px ui-monospace,monospace;margin:7px 0}.filters{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink);margin-bottom:12px}.filters button{height:40px;border:0;border-right:1px solid var(--ink);background:var(--white);font-size:10px}.filters button:last-child{border-right:0}.filters .on{background:var(--red);color:white}.review{border:1px solid var(--ink);background:var(--white);padding:12px}.person{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:8px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--blue);color:white;display:grid;place-items:center;font-weight:900}.tag{background:var(--yellow);padding:4px 6px;font-size:9px;border:1px solid var(--ink)}.tabbar{position:absolute;left:0;right:0;bottom:0;height:58px;background:var(--white);border-top:2px solid var(--ink);display:grid;grid-template-columns:repeat(3,1fr);z-index:5}.tabbar button{border:0;background:transparent;color:var(--muted);font-size:10px}.tabbar .on{color:var(--red);font-weight:900}
    .phone-label,.poster-copy .date,.metric span,.title-row span,.sec-head i,.step,.filters button,.tag,.tabbar button{font-size:12px}.small,.note{font-size:14px}
  </style>
</head>
<body><div id="root"></div>
<script type="text/babel">
  const iosFrameStyles={wrapper:{display:'inline-block',padding:8,background:'#171716',borderRadius:44,boxShadow:'0 0 0 2px #45423d,0 18px 46px rgba(47,35,21,.27)',position:'relative'},screen:{position:'relative',borderRadius:36,overflow:'hidden',background:'#f2ead9'},statusBar:{position:'absolute',top:0,left:0,right:0,height:45,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 23px',fontSize:12,fontWeight:700,zIndex:20,pointerEvents:'none'},dynamicIsland:{position:'absolute',top:8,left:'50%',transform:'translateX(-50%)',width:94,height:28,background:'#000',borderRadius:999,zIndex:30},statusIcons:{display:'flex',gap:5},content:{position:'absolute',top:45,left:0,right:0,bottom:25,overflow:'hidden'},homeIndicator:{position:'absolute',bottom:7,left:'50%',transform:'translateX(-50%)',width:107,height:4,background:'rgba(0,0,0,.35)',borderRadius:999,zIndex:10}};
  function IosFrame({children,width=290,height=628}){return <div style={iosFrameStyles.wrapper}><div style={{...iosFrameStyles.screen,width,height}}><div style={iosFrameStyles.statusBar}><span>9:41</span><div style={iosFrameStyles.statusIcons}><span>▂▄▆█</span><span>⌁</span><span>▰</span></div></div><div style={iosFrameStyles.dynamicIsland}/><div style={iosFrameStyles.content}>{children}</div><div style={iosFrameStyles.homeIndicator}/></div></div>}
  function Nav(){return <div className="nav"><div className="brand"><img src="../../../../miniprogram/assets/brand/logo-circle-144.png"/><span>此里</span></div><div className="capsule">•• ○</div></div>}
  function RouteLine({light=false}){return <svg viewBox="0 0 260 90" fill="none"><path d="M8 70 C35 10,58 82,88 42 S145 8,166 50 S219 82,252 16" stroke={light?'#f2ead9':'#d9381e'} strokeWidth="5" strokeLinecap="round"/><circle cx="8" cy="70" r="5" fill="#e8b829"/><circle cx="252" cy="16" r="5" fill="#3f708d"/></svg>}
  function Poster(){return <div className="poster"><div className="geo-a"/><div className="geo-b"/><div className="geo-c"/><div className="route"><RouteLine light/></div><div className="poster-no">44</div><div className="poster-copy"><div className="date">11.02 · 05:40</div><h2>破晓螳河</h2></div></div>}
  function Tabs({go,active}){return <div className="tabbar"><button className={active==='activities'?'on':''} onClick={()=>go('activities')}>◉<br/>活动</button><button className={active==='credential'?'on':''} onClick={()=>go('credential')}>▤<br/>行程</button><button onClick={()=>go('admin')}>●<br/>我的</button></div>}
  function Activities({go}){return <div className="screen"><div className="app"><Nav/><Poster/><div className="metricbar"><div className="metric"><b>68</b><span>公里</span></div><div className="metric"><b>420</b><span>爬升 m</span></div><div className="metric"><b>7</b><span>剩余名额</span></div></div><div className="content"><div className="title-row"><h3>本季路线海报</h3><span>共 4 场</span></div><button className="event" onClick={()=>go('detail')}><div className="event-geo"/><div className="event-copy"><b>大凉山黄昏线</b><div className="small">11.08 · 32km · 进阶</div></div></button><div className="event"><div className="event-geo" style={{background:'linear-gradient(45deg,#181817 0 50%,#d9381e 50%)'}}/><div className="event-copy"><b>城市夜灯</b><div className="small">每周三 · 18km · 周常</div></div></div></div></div><Tabs go={go} active="activities"/></div>}
  function Detail({go}){return <div className="screen"><div className="app"><Nav/><Poster/><div className="metricbar"><div className="metric"><b>68</b><span>km</span></div><div className="metric"><b>420</b><span>m↑</span></div><div className="metric"><b>5h30</b><span>预计</span></div></div><div className="content"><div className="section"><div className="sec-head"><i>01</i><b>集合与出发</b></div><div className="rows"><div className="row"><span>集合时间</span><b>05:40</b></div><div className="row"><span>集合地点</span><b>海埂公园 1 号门</b></div></div></div><div className="section"><div className="sec-head"><i>02</i><b>路线有迹可循</b></div><div className="route-card"><RouteLine light/></div><div className="small" style={{marginTop:7}}>Strava / GPX · 海拔曲线 · 起点导航沿用现有路线能力</div></div><button className="btn red" onClick={()=>go('registration')}>填写报名</button></div></div></div>}
  function Registration({go}){return <div className="screen"><div className="app"><Nav/><div className="content"><div className="title-row"><h3>报名 / EP.044</h3><span>CAST FORM</span></div><div style={{font:'900 33px/1.08 "Songti SC",serif',margin:'17px 0'}}>为这场骑行，<br/>留下一个位置。</div><div className="steps"><div className="step on">填写报名</div><div className="step">组织审核</div><div className="step">获取凭证</div></div><div className="section"><div className="sec-head"><i>01</i><b>本人资料</b></div><div className="field"><label>真实姓名</label><input value="林远" readOnly/></div><div className="field"><label>本人电话</label><input value="138 0000 0000" readOnly/></div></div><div className="section"><div className="sec-head"><i>02</i><b>出发选择</b></div><div className="field"><label>骑行经验</label><div className="choice"><button className="on">有经验</button><button>常骑</button></div></div><div className="field"><label>集合方式</label><div className="choice"><button className="on">自行前往</button><button>后援车</button></div></div></div><div className="note">我已阅读行前约定。实名与电话仅本人和审核管理员完整可见。</div><button className="btn red" onClick={()=>go('credential')}>提交报名</button></div></div></div>}
  function Credential({go}){return <div className="screen"><div className="app"><Nav/><div className="content"><div className="title-row"><h3>出发凭证</h3><span>APPROVED</span></div><div style={{font:'900 33px/1.08 "Songti SC",serif',margin:'16px 0'}}>出发，路上见。</div><div className="ticket"><div className="ticket-art"><b>破晓螳河</b></div><div className="ticket-body"><div className="small">PASSENGER · LIN YUAN</div><div className="time">05:40</div><div className="row"><span>日期</span><b>2026.11.02</b></div><div className="row"><span>地点</span><b>海埂公园 1 号门</b></div><div className="row"><span>方式</span><b>自行前往</b></div></div></div><div className="note" style={{marginTop:12}}>凭证不生成条码；活动群二维码仍只在活动详情按现有权限展示。</div><button className="btn" onClick={()=>go('activities')}>返回活动</button></div></div><Tabs go={go} active="credential"/></div>}
  function Admin({go}){return <div className="screen"><div className="app"><Nav/><div className="content"><div className="title-row"><h3>审核工作台</h3><span>BACKSTAGE</span></div><div style={{font:'900 31px/1.08 "Songti SC",serif',margin:'17px 0'}}>状态先行，<br/>逐项确认。</div><div className="filters"><button>候补 2</button><button className="on">待审核 3</button><button>已通过</button></div><div className="review"><div className="person"><div className="avatar">林</div><div><b>林远</b><div className="small">骑友 · 林小远</div></div><span className="tag">待审核</span></div><div className="section"><div className="sec-head"><i>A</i><b>报名事实</b></div><div className="rows"><div className="row"><span>电话</span><b>138 0000 0000</b></div><div className="row"><span>经验</span><b>有经验</b></div><div className="row"><span>集合</span><b>自行前往</b></div></div></div><button className="btn red" onClick={()=>go('credential')}>查看并处理</button></div><div className="note" style={{marginTop:12}}>状态颜色只强调当前处理项，业务状态名保持原样。</div></div></div></div>}
  function Screen({screen,go}){return screen==='detail'?<Detail go={go}/>:screen==='registration'?<Registration go={go}/>:screen==='credential'?<Credential go={go}/>:screen==='admin'?<Admin go={go}/>:<Activities go={go}/>}
  function Phone({initial,width,height}){const [screen,setScreen]=React.useState(initial);return <IosFrame width={width} height={height}><Screen screen={screen} go={setScreen}/></IosFrame>}
  const phones=[['p1','01 · POSTERS','activities',260,563],['p2','02 · ROUTE','detail',300,650],['p3','03 · FORM','registration',330,715],['p4','04 · PASS','credential',300,650],['p5','05 · REVIEW','admin',260,563]];
  function App(){return <main className="board"><div className="board-art"/><div className="board-grid"/><header className="board-head"><div className="direction">DIRECTION C · GENERATED ROUTE POSTER</div><h1>路线海报</h1><div className="board-copy">用现有路线、时间和里程生成每场活动独有的海报。照片不好或缺失时仍有稳定品牌表现，也不会伪造新的业务数据。</div></header><div className="palette"><i/><i/><i/><i/></div>{phones.map(([pos,label,screen,w,h])=><div className={`phone-pos ${pos}`} key={pos}><div className="phone-label"><b>{label.split(' · ')[0]}</b> · {label.split(' · ')[1]}</div><Phone initial={screen} width={w} height={h}/></div>)}</main>}
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
