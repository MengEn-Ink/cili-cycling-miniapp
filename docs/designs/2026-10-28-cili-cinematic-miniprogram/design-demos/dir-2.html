<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B · 片场通告 — CILI CINEMA 小程序方向稿</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    :root{--paper:#f7efdf;--white:#fffdf8;--ink:#211f1c;--muted:#736b62;--rule:#a79d91;--red:#c0321f;--red2:#e13b2b;--black:#171512;--soft:#eadbc2}
    *{box-sizing:border-box}html,body,#root{margin:0;min-height:100%;background:#e7ddca}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink)}button,input{font:inherit}
    .board{width:1800px;height:1200px;position:relative;overflow:hidden;background:linear-gradient(90deg,transparent 0 49px,rgba(82,62,43,.08) 50px 51px,transparent 52px),linear-gradient(#f2e9d8,#e7ddca)}
    .board:before{content:"CALL SHEET / 2026.11.02 / CILI";position:absolute;right:34px;top:42px;writing-mode:vertical-rl;font:700 12px ui-monospace,monospace;letter-spacing:.23em;color:#7a6e61}.board-head{position:absolute;left:76px;top:64px;width:540px}.index{display:inline-grid;place-items:center;width:56px;height:56px;background:var(--red);color:white;font:800 18px ui-monospace,monospace}.board h1{font:900 70px/1 "Songti SC",STSong,serif;margin:20px 0 12px}.board-copy{font-size:18px;line-height:1.7;color:#6f675d}.rule-copy{position:absolute;left:670px;top:70px;width:660px;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);padding:12px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;font:12px/1.6 ui-monospace,monospace}.rule-copy b{display:block;color:var(--red);margin-bottom:4px}
    .phone-pos{position:absolute;z-index:2}.p1{left:55px;top:380px}.p2{left:350px;top:270px}.p3{left:720px;top:225px}.p4{left:1090px;top:290px}.p5{left:1450px;top:400px}.phone-label{font:800 12px ui-monospace,monospace;letter-spacing:.11em;margin:0 0 9px 8px}.phone-label span{color:var(--red)}
    .screen{height:100%;position:relative;background:var(--paper);overflow:hidden}.app{height:100%;overflow:auto;padding-bottom:66px}.app::-webkit-scrollbar{display:none}.wechat-nav{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--paper)}.brand{display:flex;align-items:center;gap:8px;font-weight:800}.brand img{width:34px;height:34px}.capsule{height:27px;min-width:64px;border:1px solid var(--rule);border-radius:99px;display:grid;place-items:center;letter-spacing:3px}.call-strip{display:grid;grid-template-columns:auto 1fr auto;align-items:center;height:28px;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);padding:0 13px;font:800 9px ui-monospace,monospace;letter-spacing:.12em}.call-strip b{color:var(--red)}.page-head{padding:20px 18px 16px}.overline{font:800 10px ui-monospace,monospace;letter-spacing:.15em;color:var(--red)}.page-head h2{font:900 34px/1.08 "Songti SC",STSong,serif;margin:8px 0}.intro{font-size:12px;line-height:1.55;color:var(--muted)}.photo{margin:0 18px;height:182px;background-color:var(--black);background-size:cover;background-position:center;border:1px solid var(--ink);position:relative}.photo:after{content:"";position:absolute;inset:auto 0 0;height:54%;background:linear-gradient(transparent,rgba(0,0,0,.75))}.photo-title{position:absolute;z-index:2;left:14px;right:auto;bottom:12px;color:white;background:var(--black);padding:6px 8px}.photo-title b{font:800 26px "Songti SC",serif}.facts{display:grid;grid-template-columns:repeat(3,1fr);margin:0 18px;border:1px solid var(--ink);border-top:0}.fact{padding:11px;border-right:1px solid var(--ink)}.fact:last-child{border-right:0}.fact b{font:800 21px ui-monospace,monospace}.fact span{display:block;font-size:10px;color:var(--muted);margin-top:3px}.content{padding:18px}.section{display:grid;grid-template-columns:38px 1fr;border-top:1px solid var(--ink);padding-top:12px;margin-top:17px}.sec-no{font:800 12px ui-monospace,monospace;color:var(--red)}.sec-body h3{font-size:18px;margin:0 0 8px}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #d6c9b7;font-size:12px}.row b{text-align:right}.btn{width:100%;min-height:48px;border:1px solid var(--red);background:var(--red);color:white;font-weight:800;margin-top:14px}.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}.card{background:var(--white);border:1px solid var(--ink);padding:14px}.card-title{font:800 22px "Songti SC",serif;margin:5px 0}.status{display:inline-block;padding:4px 7px;background:var(--black);color:white;font-size:10px}.status.red{background:var(--red)}.timeline{position:relative;padding-left:18px}.timeline:before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:1px;background:var(--red)}.time{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:8px 0;font-size:12px}.time b{font-family:ui-monospace,monospace}.steps{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink);margin-bottom:14px}.step{text-align:center;padding:9px 4px;font-size:10px;border-right:1px solid var(--ink)}.step:last-child{border-right:0}.step.on{background:var(--red);color:#fff}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;height:43px;border:1px solid var(--ink);background:#fffdf8;padding:0 10px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices button{height:44px;border:1px solid var(--ink);background:transparent}.choices .on{background:var(--soft);border:2px solid var(--red)}.privacy{font-size:10px;line-height:1.5;color:var(--muted);border-left:3px solid var(--red);padding-left:9px}.ticket{border:1px solid var(--ink);background:var(--white)}.ticket-top{display:flex;justify-content:space-between;padding:12px;background:var(--black);color:white;font:800 11px ui-monospace,monospace}.ticket-body{padding:15px}.bigtime{font:900 42px ui-monospace,monospace;margin:10px 0}.filter{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink);margin-bottom:12px}.filter button{min-height:40px;border:0;border-right:1px solid var(--ink);background:transparent;font-size:10px}.filter button:last-child{border-right:0}.filter .on{background:var(--ink);color:white}.person{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:9px}.avatar{width:40px;height:40px;border-radius:50%;background:var(--red);color:white;display:grid;place-items:center;font-weight:900}.tag{font-size:10px;border:1px solid var(--red);color:var(--red);padding:4px 6px}.tabbar{position:absolute;left:0;right:0;bottom:0;height:58px;background:var(--white);border-top:1px solid var(--ink);display:grid;grid-template-columns:repeat(3,1fr);z-index:5}.tabbar button{border:0;background:none;color:var(--muted);font-size:10px}.tabbar .on{color:var(--red);font-weight:800}
    .call-strip,.overline,.fact span,.status,.step,.ticket-top,.filter button,.tag,.tabbar button{font-size:12px}.privacy{font-size:14px}.photo{display:block;width:calc(100% - 36px)}.photo-title{left:14px;right:14px;text-align:left}.photo-title b{display:inline-block;background:var(--black);color:white;white-space:nowrap}
  </style>
</head>
<body><div id="root"></div>
<script type="text/babel">
  const PHOTOS={lake:'../../2026-10-22-cycling-image-journal/assets/lakeside.webp',mountain:'../../2026-10-22-cycling-image-journal/assets/mountain.webp'};
  const iosFrameStyles={wrapper:{display:'inline-block',padding:8,background:'#1b1916',borderRadius:43,boxShadow:'0 0 0 2px #5d554b,0 18px 40px rgba(68,51,31,.25)',position:'relative'},screen:{position:'relative',borderRadius:35,overflow:'hidden',background:'#f7efdf'},statusBar:{position:'absolute',top:0,left:0,right:0,height:44,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 23px',fontSize:12,fontWeight:700,zIndex:20,pointerEvents:'none'},dynamicIsland:{position:'absolute',top:8,left:'50%',transform:'translateX(-50%)',width:92,height:27,background:'#000',borderRadius:999,zIndex:30},statusIcons:{display:'flex',gap:5},content:{position:'absolute',top:44,left:0,right:0,bottom:25,overflow:'hidden'},homeIndicator:{position:'absolute',bottom:7,left:'50%',transform:'translateX(-50%)',width:106,height:4,background:'rgba(0,0,0,.35)',borderRadius:999,zIndex:10}};
  function IosFrame({children,width=290,height=628}){return <div style={iosFrameStyles.wrapper}><div style={{...iosFrameStyles.screen,width,height}}><div style={iosFrameStyles.statusBar}><span>9:41</span><div style={iosFrameStyles.statusIcons}><span>▂▄▆█</span><span>⌁</span><span>▰</span></div></div><div style={iosFrameStyles.dynamicIsland}/><div style={iosFrameStyles.content}>{children}</div><div style={iosFrameStyles.homeIndicator}/></div></div>}
  function Chrome({code='01'}){return <><div className="wechat-nav"><div className="brand"><img src="../../../../miniprogram/assets/brand/logo-circle-144.png"/><span>此里</span></div><div className="capsule">•• ○</div></div><div className="call-strip"><b>{code}</b><span style={{textAlign:'center'}}>CILI · CALL SHEET</span><span>2026.11.02</span></div></>}
  function Tabs({go,active}){return <div className="tabbar"><button className={active==='activities'?'on':''} onClick={()=>go('activities')}>◉<br/>活动</button><button className={active==='credential'?'on':''} onClick={()=>go('credential')}>▤<br/>行程</button><button onClick={()=>go('admin')}>●<br/>我的</button></div>}
  function Activities({go}){return <div className="screen"><div className="app"><Chrome/><div className="page-head"><div className="overline">此里 · 一起出发</div><h2>把周末，<br/>交给山路。</h2><div className="intro">本周主活动已排进放映表，时间、路线与名额一眼核对。</div></div><button className="photo" onClick={()=>go('detail')} style={{backgroundImage:`url(${PHOTOS.lake})`}}><div className="photo-title"><span className="status red">报名中</span><br/><b>破晓螳河</b></div></button><div className="facts"><div className="fact"><b>68</b><span>公里</span></div><div className="fact"><b>420</b><span>爬升 m</span></div><div className="fact"><b>7</b><span>剩余名额</span></div></div><div className="content"><div className="section"><span className="sec-no">02</span><div className="sec-body"><h3>近期活动</h3><div className="card"><span className="status">11.08</span><div className="card-title">大凉山黄昏线</div><div className="intro">32km · 进阶 · 集合地点待公布</div></div></div></div></div></div><Tabs go={go} active="activities"/></div>}
  function Detail({go}){return <div className="screen"><div className="app"><Chrome code="02"/><div className="page-head"><div className="overline">活动详情 · EP.044</div><h2>破晓螳河</h2><div className="intro">11.02 周日 · 此里公开活动 · 报名中</div></div><div className="photo" style={{height:145,backgroundImage:`url(${PHOTOS.mountain})`}}></div><div className="facts"><div className="fact"><b>68</b><span>km</span></div><div className="fact"><b>420</b><span>m↑</span></div><div className="fact"><b>5h30</b><span>预计</span></div></div><div className="content"><div className="section"><span className="sec-no">01</span><div className="sec-body"><h3>集合与出发</h3><div className="row"><span>集合时间</span><b>05:40</b></div><div className="row"><span>集合地点</span><b>海埂公园 1 号门</b></div></div></div><div className="section"><span className="sec-no">02</span><div className="sec-body"><h3>时间安排</h3><div className="timeline"><div className="time"><b>06:00</b><span>破晓启程 · KM 0</span></div><div className="time"><b>07:30</b><span>一号补给 · KM 32</span></div><div className="time"><b>11:30</b><span>终点合影 · KM 68</span></div></div><button className="btn" onClick={()=>go('registration')}>填写报名</button></div></div></div></div></div>}
  function Registration({go}){return <div className="screen"><div className="app"><Chrome code="03"/><div className="page-head"><div className="overline">报名通告 · 当前</div><h2>确认资料，<br/>再一起出发。</h2></div><div className="content" style={{paddingTop:0}}><div className="steps"><div className="step on">填写报名</div><div className="step">组织审核</div><div className="step">获取凭证</div></div><div className="card"><div className="overline">当前活动</div><div className="card-title">破晓螳河</div><div className="row"><span>报名模式</span><b>审核报名</b></div><div className="row"><span>集合</span><b>05:40 · 海埂门 1</b></div></div><div className="section"><span className="sec-no">01</span><div className="sec-body"><h3>报名资料</h3><div className="field"><label>真实姓名</label><input value="林远" readOnly/></div><div className="field"><label>本人电话</label><input value="138 0000 0000" readOnly/></div><div className="field"><label>骑行经验</label><div className="choices"><button className="on">有经验</button><button>常骑</button></div></div><div className="privacy">我已阅读行前约定。实名与电话仅本人和审核管理员完整可见。</div><button className="btn" onClick={()=>go('credential')}>提交报名</button></div></div></div></div></div>}
  function Credential({go}){return <div className="screen"><div className="app"><Chrome code="04"/><div className="page-head"><div className="overline">出发凭证 · 已生效</div><h2>出发，路上见。</h2><div className="intro">报名已通过，请核对集合时间与地点。</div></div><div className="content" style={{paddingTop:0}}><div className="ticket"><div className="ticket-top"><span>CILI · EP044</span><span>APPROVED</span></div><div className="ticket-body"><div className="overline">PASSENGER · LIN YUAN</div><div className="card-title">破晓螳河</div><div className="bigtime">05:40</div><div className="row"><span>日期</span><b>2026.11.02</b></div><div className="row"><span>集合地点</span><b>海埂公园 1 号门</b></div><div className="row"><span>集合方式</span><b>自行前往</b></div></div></div><button className="btn ghost" onClick={()=>go('activities')}>返回活动</button><div className="privacy" style={{marginTop:12}}>凭证只展示现有报名事实，不生成条码或个人二维码。</div></div></div><Tabs go={go} active="credential"/></div>}
  function Admin({go}){return <div className="screen"><div className="app"><Chrome code="05"/><div className="page-head"><div className="overline">审核工作台 · 破晓螳河</div><h2>逐项确认，<br/>再放行。</h2></div><div className="content" style={{paddingTop:0}}><div className="filter"><button>候补 2</button><button className="on">待审核 3</button><button>已通过</button></div><div className="card"><div className="person"><div className="avatar">林</div><div><b>林远</b><div className="intro">骑友 · 林小远</div></div><span className="tag">待审核</span></div><div className="section"><span className="sec-no">A</span><div className="sec-body"><div className="row"><span>电话</span><b>138 0000 0000</b></div><div className="row"><span>经验</span><b>有经验</b></div><div className="row"><span>集合方式</span><b>自行前往</b></div><button className="btn" onClick={()=>go('credential')}>查看并处理</button></div></div></div><div className="privacy" style={{marginTop:12}}>审核页保持实名和电话完整显示；公开骑友名单只显示昵称。</div></div></div></div>}
  function Screen({screen,go}){return screen==='detail'?<Detail go={go}/>:screen==='registration'?<Registration go={go}/>:screen==='credential'?<Credential go={go}/>:screen==='admin'?<Admin go={go}/>:<Activities go={go}/>}
  function Phone({initial,width,height}){const [screen,setScreen]=React.useState(initial);return <IosFrame width={width} height={height}><Screen screen={screen} go={setScreen}/></IosFrame>}
  const phones=[['p1','01 / 活动', 'activities',260,563],['p2','02 / 详情','detail',300,650],['p3','03 / 报名通告','registration',330,715],['p4','04 / 出发凭证','credential',300,650],['p5','05 / 审核后台','admin',260,563]];
  function App(){return <main className="board"><header className="board-head"><span className="index">B</span><h1>片场通告</h1><div className="board-copy">把电影感从“黑色滤镜”升级成一套可核对的编辑系统。影像负责吸引，连续纸面负责承载报名、凭证与后台长表单。</div></header><div className="rule-copy"><div><b>影像</b>照片只出现在决策入口</div><div><b>事实</b>时间、状态、隐私逐行核对</div><div><b>动作</b>朱红只给主操作和风险</div></div>{phones.map(([pos,label,screen,w,h])=><div className={`phone-pos ${pos}`} key={pos}><div className="phone-label"><span>{label.split(' / ')[0]}</span> / {label.split(' / ')[1]}</div><Phone initial={screen} width={w} height={h}/></div>)}</main>}
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
