<!doctype html><html lang="zh-CN" class="light"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俱乐部 · 此里骑行影像志</title>
    <style id="theme-vars">
:root {
  --color-bg:#fbf5ea;--color-surface:#fff;--color-raised:#f3e6d0;
  --color-text:#211f1c;--color-muted:#6f675d;--color-placeholder:#6f675d;
  --color-disabled-text:#6f675d;--color-border:#ededed;--color-border-strong:#9a9186;
  --color-action:#c0321f;--color-action-active:#a52a1c;--color-on-action:#fff;
  --color-brand:#e13b2b;--color-brand-soft:#fcebea;--color-on-brand:#0c0a07;
  --color-on-media:#fff;--color-media-muted:#d4d4d4;--color-media-card-bg:#211f1c;
  --color-status-success:#16633a;--color-status-success-soft:#e7f4eb;
  --color-status-warning:#7a5c00;--color-status-warning-soft:#fff2c7;
  --radius-xs:4px;--radius-sm:6px;--radius-md:10px;--radius-card:14px;--radius-display:16px;
  --space-1:4px;--space-2:6px;--space-3:8px;--space-4:12px;--space-5:16px;--space-6:24px;
  --page-gutter:14px;--control-height:48px;--segment-height:46px;--card-gap:10px;
  --route-preview-canvas-height:144px;--group-qr-code-size:96px;
  --font-size-label:12px;--font-size-body:14px;--font-size-title:18px;--font-size-display:24px;
  --motion-duration-fast:120ms;--motion-duration-base:180ms;
  --motion-easing-standard:cubic-bezier(.2,0,0,1);
  --button-bg:var(--color-action);--button-text:var(--color-on-action);
  --card-bg:var(--color-surface);--input-border:var(--color-border-strong);
  --cili-background:var(--color-bg);--cili-foreground:var(--color-text);
  --cili-card:var(--color-surface);--cili-primary:var(--color-action);
  --cili-primary-foreground:var(--color-on-action);--cili-border:var(--color-border-strong);
  --cili-muted:var(--color-raised);--cili-muted-foreground:var(--color-muted);
  --cili-radius-sm:var(--radius-sm);--cili-radius-md:var(--radius-md);--cili-radius-lg:var(--radius-card);
}
*{box-sizing:border-box}
html{background:var(--color-bg);color:var(--color-text);font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;font-size:14px}
body{margin:0}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--color-action);outline-offset:3px}
button:disabled{background:var(--color-raised)!important;color:var(--color-disabled-text)!important;border-color:var(--color-border-strong)!important}
h1,h2,h3,p,figure,dl,dd{margin:0}
p{line-height:1.65}
svg{display:block}
.icon{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mini-page{max-width:430px;margin:auto;background:var(--color-bg);min-height:100vh;position:relative}
.statusbar{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:13px;font-weight:700}
.statusbar .system-icons{display:flex;align-items:center;gap:6px}
.statusbar .system-icons svg{width:15px;height:15px}
.systemnav{height:44px;display:flex;align-items:center;gap:8px;padding:0 var(--page-gutter)}
.navtitle{font-size:14px;font-weight:700;flex:1}
.capsule{display:flex;align-items:center;justify-content:space-evenly;width:86px;height:30px;border:1px solid var(--color-border-strong);border-radius:var(--radius-display);font-size:20px;background:rgba(255,255,255,.5);letter-spacing:1px}
.capsule b{font-weight:400;border-left:1px solid var(--color-border-strong);padding-left:12px}
.iconbutton{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:var(--radius-sm)}
.iconbutton:active{background:var(--color-raised)}
.wordmark{font-size:24px;font-weight:900;letter-spacing:-1px}
.brand-dot{display:inline-block;width:8px;height:8px;background:var(--color-brand);margin-left:3px}
.content{padding:24px var(--page-gutter)}
.content.tight{padding-top:16px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:1px;color:var(--color-muted);line-height:1.5}
.eyebrow::before{content:"";height:1px;width:20px;background:currentColor}
.pageheading{padding:22px var(--page-gutter) 24px}
.pageheading h1{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.3;margin:8px 0 10px}
.pageheading p{font-size:14px;color:var(--color-muted)}
.editorial{font-family:"Songti SC","STSong",serif;font-weight:600}
.chapterhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;gap:8px}
.chapterhead h2{font-size:22px;letter-spacing:-.5px;line-height:1.4}
.chapterhead span{font-size:12px;color:var(--color-muted)}
.section{margin-top:32px}
.section:first-child{margin-top:0}
.muted{color:var(--color-muted)}
.small{font-size:12px;line-height:1.6}
.mono{font-family:"SFMono-Regular",Consolas,monospace;font-variant-numeric:tabular-nums}
.number{font-family:"Arial Narrow",Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--color-raised);padding:4px 8px;border-radius:var(--radius-xs);font-size:12px;font-weight:700;line-height:1.5}
.tag.success{background:var(--color-status-success-soft);color:var(--color-status-success)}
.tag.warning{background:var(--color-status-warning-soft);color:var(--color-status-warning)}
.tag.dark{background:var(--color-text);color:var(--color-on-media)}
.tag .icon{width:13px;height:13px}
.pillrow{display:flex;gap:8px;flex-wrap:wrap}
.segment{display:flex;border-bottom:1px solid var(--color-border-strong);gap:24px;min-height:var(--segment-height);margin:0 var(--page-gutter) 24px}
.segment button{min-height:var(--segment-height);background:transparent;border:0;border-bottom:3px solid transparent;padding:0 4px;white-space:nowrap}
.segment button[aria-selected=true]{border-bottom-color:var(--color-action);font-weight:800}
.segment .end{margin-left:auto;padding:0;width:44px}
.photo{position:relative;overflow:hidden;background:var(--color-media-card-bg)}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.photo .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 36%,rgba(15,13,10,.9) 100%)}
.photo .caption{position:absolute;bottom:0;left:0;right:0;padding:24px;color:var(--color-on-media)}
.photo .caption .eyebrow{color:var(--color-media-muted)}
.photo .caption h1,.photo .caption h2{font-size:36px;letter-spacing:-1px;line-height:1.25;margin:10px 0 12px}
.photo .caption p{color:var(--color-media-muted);font-size:12px}
.photo .corner{position:absolute;top:16px;left:16px}
.hero{height:340px}
.hero.detail{height:320px}
.hero.club{height:300px}
.hero.portrait{height:370px}
.hero.portrait img{object-position:center 47%}
.image-fallback{display:none;background:var(--color-media-card-bg);color:var(--color-on-media);padding:48px 24px;text-align:center;min-height:220px}
.image-fallback .icon{width:32px;height:32px;margin:0 auto 16px}
.photo.failed img,.photo.failed .shade,.photo.failed .caption,.photo.failed .corner{display:none}
.photo.failed .image-fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
.photocredit{padding:8px var(--page-gutter);font-size:11px;color:var(--color-muted)}
.story{display:block;margin:0 var(--page-gutter) 32px}
.story .photo{height:320px;border-radius:var(--radius-sm)}
.story .caption{padding:20px}
.story .caption h2{font-size:30px}
.storyfacts{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--color-border-strong);gap:8px}
.storyfacts strong{font-size:20px;font-family:"Arial Narrow",Arial,sans-serif}
.storyfacts span{font-size:12px;color:var(--color-muted)}
.storymeta{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:12px 0;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;border-bottom:1px solid var(--color-border);padding:12px 0}
.row .lead{display:flex;align-items:center;gap:12px;min-width:0}
.row .lead div{min-width:0}
.row strong{display:block;font-size:15px}
.row small{font-size:12px;line-height:1.6;color:var(--color-muted)}
.row .trailing{display:flex;align-items:center;gap:8px;color:var(--color-muted)}
.rowlink:hover,.rowlink:active{background:var(--color-raised)}
.rowlink{transition:background var(--motion-duration-fast)}
.paper{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:20px}
.paper+.paper{margin-top:var(--card-gap)}
.ink{background:var(--color-media-card-bg);color:var(--color-on-media);padding:24px var(--page-gutter)}
.ink .muted,.ink .eyebrow{color:var(--color-media-muted)}
.ink .row{border-color:var(--color-border-strong)}
.ink .row small{color:var(--color-media-muted)}
.ink .tag{background:var(--color-raised);color:var(--color-text)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metrics strong{font-size:32px;font-family:"Arial Narrow",Arial,sans-serif;letter-spacing:-1px;line-height:1.2}
.metrics span{font-size:12px;display:block;margin-top:6px}
.metrics .unit{display:inline;font-size:12px;margin-left:4px;font-weight:400;letter-spacing:0}
.metrics>div+div{border-left:1px solid var(--color-border-strong);padding-left:16px}
.decision{border-left:4px solid var(--color-brand);margin-top:24px;padding:20px 16px;background:var(--color-media-card-bg);color:var(--color-on-media)}
.decision h3{font-size:22px;line-height:1.4;margin-bottom:8px}
.decision p{font-size:14px;color:var(--color-media-muted)}
.decision .btn{margin-top:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:var(--control-height);width:100%;padding:12px 16px;border:1px solid var(--color-action);background:var(--color-action);color:var(--color-on-action);font-weight:700;border-radius:var(--radius-sm);line-height:1.5;transition:background var(--motion-duration-fast)}
.btn:hover,.btn:active{background:var(--color-action-active)}
.btn.secondary{background:var(--color-surface);color:var(--color-text);border-color:var(--color-border-strong)}
.btn.secondary:active,.btn.secondary:hover{background:var(--color-raised)}
.btn.ghost{background:transparent;color:var(--color-action);border-color:transparent}
.btn.ghost:hover{background:var(--color-brand-soft)}
.buttonpair{display:flex;gap:10px}
.buttonpair .btn{flex:1}
.actionbar{padding:16px var(--page-gutter) calc(16px + env(safe-area-inset-bottom));background:var(--color-bg);border-top:1px solid var(--color-border-strong)}
.actionbar .small{margin-bottom:12px}
.tabbar{display:grid;grid-template-columns:repeat(3,1fr);padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--color-surface);border-top:1px solid var(--color-border-strong)}
.tabbar a{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--color-muted)}
.tabbar a[aria-current=page]{color:var(--color-action);font-weight:800}
.tabbar .icon{width:22px;height:22px}
.field{margin-bottom:24px}
.field label,.fieldlegend{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.field label .optional{font-weight:400;color:var(--color-muted)}
.field input,.field textarea,.field select{display:block;width:100%;min-height:var(--control-height);padding:12px;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-sm);line-height:1.6}
.field input::placeholder,.field textarea::placeholder{color:var(--color-placeholder)}
.field textarea{min-height:112px;resize:vertical}
.field small{display:block;font-size:12px;color:var(--color-muted);margin-top:6px;line-height:1.6}
.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:0;padding:0;margin:0 0 24px}
.choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:flex;align-items:center;gap:10px;min-height:48px;border:1px solid var(--color-border-strong);background:var(--color-surface);border-radius:var(--radius-sm);padding:12px;cursor:pointer}
.choice:has(input:checked){border-color:var(--color-action);background:var(--color-brand-soft)}
.choice input{width:18px;height:18px;accent-color:var(--color-action);flex-shrink:0}
.check{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:12px 0;font-size:14px;line-height:1.65}
.check input{width:18px;height:18px;accent-color:var(--color-action);flex-shrink:0;margin-top:3px}
.notice{padding:12px 0;display:flex;align-items:flex-start;gap:8px;font-size:14px;line-height:1.65}
.notice .icon{margin-top:2px}
.notice.warning{color:var(--color-status-warning)}
.notice.success{color:var(--color-status-success)}
.notice.error{color:var(--color-action)}
.timeline{display:flex;justify-content:space-between;gap:8px;margin:8px 0 28px}
.timeline span{font-size:12px;display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;color:var(--color-muted)}
.timeline b{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid var(--color-border-strong);border-radius:var(--radius-display);font-size:12px}
.timeline .active{color:var(--color-text);font-weight:800}
.timeline .active b{background:var(--color-text);color:var(--color-on-media);border-color:var(--color-text)}
.avatar{width:48px;height:48px;object-fit:cover;object-position:50% 25%;border-radius:var(--radius-display);background:var(--color-raised);border:1px solid var(--color-border-strong)}
.avatar.large{width:76px;height:76px}
.initialavatar{display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.person{display:flex;align-items:center;gap:14px}
.person h2{font-size:24px}
.person p{color:var(--color-muted);font-size:12px;margin-top:4px}
.riderlist{display:flex;gap:16px;flex-wrap:wrap}
.riderlist a{width:56px;min-height:76px;display:flex;align-items:center;flex-direction:column;gap:8px;font-size:12px}
.riderlist .rider{width:56px;min-height:76px;display:flex;align-items:center;flex-direction:column;gap:8px;font-size:12px}
.profile-hero{position:relative;height:340px;background:var(--color-media-card-bg);color:var(--color-on-media);overflow:hidden}
.profile-background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.profile-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,13,10,.08) 5%,rgba(15,13,10,.32) 40%,rgba(15,13,10,.96) 100%);pointer-events:none}
.profile-identity{position:absolute;z-index:1;left:24px;right:24px;bottom:28px;display:flex;align-items:flex-end;gap:16px;pointer-events:none}
.profile-identity .avatar-trigger{pointer-events:auto}
.profile-identity h1{font-family:"Songti SC","STSong",serif;font-size:36px;line-height:1.25;font-weight:600;margin:8px 0}
.profile-identity p,.profile-identity .eyebrow{color:var(--color-media-muted);font-size:12px}
.avatar-trigger{padding:0;border:0;background:transparent;min-width:76px;min-height:76px;border-radius:var(--radius-display)}
.avatar-trigger .avatar{width:76px;height:76px;border:2px solid var(--color-on-media)}
.background-trigger{position:absolute;inset:0;border:0;background:transparent;z-index:1;width:100%;height:100%}
.profile-label{position:absolute;z-index:2;top:18px;left:24px;background:var(--color-media-card-bg);color:var(--color-on-media);padding:6px 10px;font-size:11px;border:1px solid var(--color-border-strong);border-radius:var(--radius-xs);pointer-events:none}
.profile-no-background{background:radial-gradient(ellipse at 75% 15%,var(--color-muted),var(--color-media-card-bg) 75%)}
.profile-status{display:flex;align-items:center;gap:8px;min-height:44px;color:var(--color-muted);font-size:12px;margin-bottom:16px}
.rowbutton{width:100%;background:transparent;border-top:0;border-left:0;border-right:0;text-align:left}
.media-preview{width:420px;padding:16px}
.media-preview img{width:100%;height:auto;max-height:60vh;object-fit:contain;margin-bottom:16px;background:var(--color-media-card-bg)}
.checklist{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:20px}
.checklist span{font-size:12px;line-height:1.6;display:flex;gap:6px;align-items:center;color:var(--color-muted)}
.checklist .icon{width:16px;height:16px}
.checklist .missing{color:var(--color-action);font-weight:700}
.upload .avatar{width:72px;height:72px}
.background-upload{display:block;padding:0;overflow:hidden}
.background-upload img{width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:0}
.background-upload>div{padding:16px}
.profile-progress{margin:8px 0 24px}
.profile-progress .chapterhead{margin:0}
.profile-progress .chapterhead h2{font-size:20px}
fieldset[disabled]{opacity:1}
fieldset[disabled] input,fieldset[disabled] select{color:var(--color-muted);background:var(--color-raised)}
.profile-details{padding:0;border:0;margin:0}
.ticket{background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-card);overflow:hidden;margin-bottom:24px}
.ticketphoto{height:144px}
.ticketbody{padding:20px}
.ticketbody h2{font-size:24px;line-height:1.4;margin:12px 0}
.ticketfooter{border-top:1px dashed var(--color-border-strong);padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.ticketfooter a{min-height:44px;display:flex;align-items:center;gap:6px;font-weight:700;color:var(--color-action)}
.ticketfooter .muted{font-size:12px}
.voucher-title{font-size:12px;letter-spacing:1px;margin-bottom:16px}
.voucher-number{white-space:nowrap;font-size:13px;letter-spacing:.1px}
.voucher h2{font-size:28px;line-height:1.3;margin:12px 0}
.voucher .detailrows{margin:20px 0}
.detailrows>div{display:flex;justify-content:space-between;gap:16px;line-height:1.6;padding:10px 0;border-bottom:1px solid var(--color-border)}
.detailrows dt{color:var(--color-muted);font-size:14px}
.detailrows dd{text-align:right;font-weight:600;font-size:14px}
.map{background:var(--color-raised);position:relative;border:1px solid var(--color-border-strong);border-radius:var(--radius-sm);overflow:hidden}
.map svg{width:100%;height:auto}
.map text{font-family:"PingFang SC",sans-serif;font-size:12px}
.map.large{border-radius:0;border-left:0;border-right:0}
.mapkey{position:absolute;left:12px;bottom:12px;background:var(--color-surface);font-size:12px;padding:6px 8px;border-radius:var(--radius-xs);border:1px solid var(--color-border-strong)}
.elevation{margin-top:16px;border-bottom:1px solid var(--color-border-strong)}
.elevation svg{width:100%}
.elevation text{font-size:11px;fill:var(--color-muted);font-family:inherit}
.point{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--color-border)}
.point .distance{min-width:44px;color:var(--color-action);font-size:12px;font-weight:700}
.point h3{font-size:16px;margin-bottom:4px}
.point p{font-size:14px;color:var(--color-muted)}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
.filters button{min-height:48px;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-sm);padding:8px;font-size:14px}
.filters button[aria-pressed=true]{background:var(--color-text);color:var(--color-on-media)}
.filters strong{margin-left:4px}
.reviewitem{background:var(--color-surface);padding:20px;border:1px solid var(--color-border);border-radius:var(--radius-card);margin-bottom:12px;display:block}
.reviewitem h3{font-size:20px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.reviewitem .meta{margin:12px 0;font-size:14px;line-height:1.8}
.reviewitem .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--color-border);padding-top:12px;font-size:12px;color:var(--color-muted)}
.upload{display:flex;align-items:center;gap:16px;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-sm);padding:12px;min-height:96px}
.upload img{width:96px;height:72px;object-fit:cover;border-radius:var(--radius-xs)}
.upload .btn{min-width:44px;width:auto;font-size:12px;margin-top:8px}
.upload strong{display:block;font-size:14px}
.progress{height:4px;background:var(--color-raised);margin-top:12px}
.progress span{height:100%;display:block;background:var(--color-action)}
.toggle{position:relative;appearance:none;min-width:44px;height:28px;border-radius:var(--radius-display);background:var(--color-raised);border:1px solid var(--color-border-strong);cursor:pointer;margin:8px 0}
.toggle:checked{background:var(--color-action);border-color:var(--color-action)}
.toggle::before{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:var(--radius-display);background:var(--color-surface);border:1px solid var(--color-border-strong);transition:transform var(--motion-duration-fast)}
.toggle:checked::before{transform:translateX(16px);border-color:var(--color-surface)}
.empty{padding:52px 16px;text-align:center}
.empty>.icon{width:40px;height:40px;margin:0 auto 20px}
.empty h2{font-size:24px;margin-bottom:12px}
.empty p{color:var(--color-muted);margin-bottom:24px}
.skeleton{height:320px;background:var(--color-raised);border-radius:var(--radius-sm)}
.skeleton.line{height:18px;margin:16px 0;width:80%}
.skeleton.short{width:45%}
.spinner{width:20px;height:20px;display:inline-block;border:2px solid var(--color-border-strong);border-top-color:var(--color-action);border-radius:var(--radius-display);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.demo-footer{font-size:11px;line-height:1.6;padding:16px var(--page-gutter);color:var(--color-muted);border-top:1px solid var(--color-border)}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:var(--color-media-card-bg);color:var(--color-on-media);padding:14px 20px;border-radius:var(--radius-sm);font-size:14px;z-index:100;max-width:90%;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.dialog{border:1px solid var(--color-border-strong);border-radius:var(--radius-card);background:var(--color-bg);color:var(--color-text);padding:24px;max-width:calc(100% - 32px);width:340px}
.dialog::backdrop{background:rgba(0,0,0,.5)}
.dialog h2{font-size:24px;margin-bottom:16px}
.dialog p{margin-bottom:24px}
[hidden]{display:none!important}
@media(max-width:350px){:root{--page-gutter:12px}.pageheading h1{font-size:28px}.photo .caption h1,.photo .caption h2{font-size:30px}.metrics strong{font-size:28px}.metrics>div+div{padding-left:10px}.paper{padding:16px}.fieldgrid{grid-template-columns:1fr}.voucher-number{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

(() => {
  const q = s => document.querySelector(s);
  const all = s => [...document.querySelectorAll(s)];
  const params = new URLSearchParams(location.search);
  const toast = text => {
    q('.toast')?.remove();
    const el = document.createElement('div');
    el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = text;
    document.body.append(el); setTimeout(() => el.remove(), 3200);
  };
  const text = (s, value) => { const el = q(s); if (el) el.textContent = value; };
  const show = (s, yes) => all(s).forEach(el => { el.hidden = !yes; });
  const on = (s, handler, event = 'click') => all(s).forEach(el => el.addEventListener(event, handler));
  on('[data-toast]', e => toast(e.currentTarget.dataset.toast));
  all('[data-admin-only]').forEach(el => { el.hidden = params.get('role') !== 'admin'; });
  if (params.get('auth') === 'guest' && q('.profile-hero')) {
    q('.profile-hero').classList.add('profile-no-background');
    q('.profile-hero').replaceChildren();
    const identity = document.createElement('div');
    identity.className = 'profile-identity';
    identity.innerHTML = '<div><div class="eyebrow">此里 · 同行从这里开始</div><h1>先认识你。</h1><p>登录后设置头像与背景，完善报名资料。</p></div>';
    q('.profile-hero').append(identity);
    const content = q('.content');
    content.innerHTML = '<div class="profile-status">尚未登录</div><button class="btn" data-profile-login>微信登录</button>';
    content.querySelector('[data-profile-login]').onclick = () => { location.href = 'profile.html'; };
  }
  if (params.get('role') === 'admin') {
    all('a[href="profile.html"],a[href="settings.html"]').forEach(el => { el.href += '?role=admin'; });
  }
  on('.photo img', e => e.currentTarget.closest('.photo').classList.add('failed'), 'error');
  on('[data-retry-image]', e => {
    const p = e.currentTarget.closest('.photo'); p.classList.remove('failed');
    p.querySelector('img').src = p.querySelector('img').src;
  });
  on('.profile-background', () => {
    q('.profile-background').hidden = true;
    q('.profile-hero').classList.add('profile-no-background');
    q('[data-preview-background]').hidden = true;
    toast('背景暂不可用，个人资料仍可查看。');
  }, 'error');
  on('.avatar-trigger img', e => {
    e.currentTarget.hidden = true;
    const fallback = document.createElement('span');
    fallback.className = 'avatar initialavatar'; fallback.textContent = '山';
    e.currentTarget.parentElement.append(fallback);
    e.currentTarget.parentElement.disabled = true;
  }, 'error');
  const preview = (source, title) => {
    if (!source) return;
    q('[data-media-image]').src = source; text('[data-media-title]', title);
    q('#media-dialog')?.showModal();
  };
  on('[data-preview-background]', () => preview(q('.profile-background')?.src, '我的背景照片'));
  on('[data-preview-avatar]', () => preview(q('.avatar-trigger img')?.src, '我的头像'));
  on('[data-close]', e => e.currentTarget.closest('dialog').close());
  on('[data-profile-retry]', e => {
    e.currentTarget.disabled = true; e.currentTarget.textContent = '正在同步…';
    setTimeout(() => { location.href = 'profile.html'; }, 500);
  });
  let mediaPending = 0;
  let routeReady = !q('[data-publish]')?.disabled;
  const lockMedia = delta => {
    mediaPending = Math.max(0, mediaPending + delta);
    all('[data-profile-save-button]').forEach(el => { el.disabled = mediaPending > 0; });
    all('[data-publish]').forEach(el => { el.disabled = mediaPending > 0 || !routeReady; });
  };
  on('[data-upload]', e => {
    const el = e.currentTarget, f = el.files?.[0]; if (!f) return;
    const avatar = el.hasAttribute('data-avatar-upload');
    const limit = el.hasAttribute('data-background-upload') ? 20 : 5;
    if (!f.type.startsWith('image/') || f.size > limit * 1024 * 1024) {
      toast(`请选择不超过 ${limit} MB 的图片。`); el.value = ''; return;
    }
    const image = el.closest('.upload')?.querySelector('img');
    if (image) image.src = URL.createObjectURL(f);
    lockMedia(1);
    const status = avatar ? '[data-avatar-save-status]' : '[data-background-status]';
    text(status, avatar ? '正在上传并保存头像…' : '正在准备背景图片…');
    setTimeout(() => {
      lockMedia(-1); text(status, avatar ? '头像已单独保存 · 本地演示' : '背景已就绪，请保存资料');
      toast(avatar ? '头像已单独保存 · 本地演示' : '图片预览已准备好 · 本地演示');
    }, 750);
  }, 'change');
  on('[data-upload-qr]', e => {
    const f = e.currentTarget.files?.[0]; if (!f) return;
    if (!f.type.startsWith('image/') || f.size > 5 * 1024 * 1024) { toast('请选择不超过 5 MB 的二维码图片。'); return; }
    lockMedia(1); toast('正在准备群二维码…');
    setTimeout(() => { lockMedia(-1); toast('群二维码已准备好 · 本地演示'); }, 750);
  }, 'change');
  on('[data-avatar-first]', e => {
    const f = e.currentTarget.files?.[0]; if (!f) return;
    if (!f.type.startsWith('image/') || f.size > 5 * 1024 * 1024) { toast('请选择不超过 5 MB 的头像图片。'); return; }
    e.currentTarget.disabled = true;
    text('[data-avatar-save-status]', '正在上传并单独保存头像…');
    setTimeout(() => { location.href = 'profile-edit.html?avatarSaved=1'; }, 750);
  }, 'change');
  if (params.has('avatarSaved')) toast('头像已单独保存，现在可以填写报名资料。');
  if (params.has('saved')) toast('资料已保存 · 本地演示');
  if (params.get('mode') === 'open') {
    const stage = q('.timeline span:nth-child(2)');
    if (stage) stage.innerHTML = '<b>2</b>名额确认';
    text('[data-registration-stage]', '名额确认');
    text('[data-registration-copy]', '有名额时直接通过；名额已满时进入候补。');
    text('[data-registration-mode-note]', '公开报名：有名额时直接通过；名额已满时进入候补。');
    text('[data-registration-mode]', '公开报名');
  }
  on('[data-submit]', e => {
    e.preventDefault(); const form = e.currentTarget;
    if (mediaPending || !form.reportValidity()) return;
    if (q('[data-publish]')?.disabled) return;
    let target = form.dataset.submit;
    if (form.querySelector('#experience')) {
      const draft = {};
      new FormData(form).forEach((v, k) => { if (['experience', 'remark', 'gathering_mode'].includes(k)) draft[k] = String(v); });
      sessionStorage.setItem('cili-design-registration', JSON.stringify(draft));
      target = params.has('full') ? 'state-waiting.html' : params.get('mode') === 'open' ? 'state-public-success.html' : 'state-pending.html';
    }
    const button = form.querySelector('button[type=submit]');
    if (button) { button.disabled = true; button.textContent = '正在提交…'; }
    setTimeout(() => { location.href = target; }, 450);
  }, 'submit');
  if (location.pathname.endsWith('state-submit-error.html')) {
    try {
      const draft = JSON.parse(sessionStorage.getItem('cili-design-registration') || '{}');
      for (const [key, value] of Object.entries(draft)) {
        const field = document.getElementById(key);
        if (field) field.value = value;
      }
    } catch {}
  }
  on('[data-local-form]', e => { e.preventDefault(); if (e.currentTarget.reportValidity()) toast('演示资料已保留在当前页面。'); }, 'submit');
  on('[data-cancel]', () => q('#cancel-dialog')?.showModal());
  on('[data-confirm-cancel]', () => { location.href = 'registrations.html?cancelled=1'; });
  const ticket = q('[data-current-ticket]');
  if (ticket && (params.has('pending') || params.has('waiting') || params.has('cancelled'))) {
    const status = params.has('cancelled') ? 'cancelled' : params.has('waiting') ? 'waiting' : 'pending';
    text('[data-ticket-status]', { cancelled: '已取消', waiting: '候补中', pending: '待审核' }[status]);
    q('[data-ticket-status]').className = status === 'cancelled' ? 'tag' : 'tag warning';
    text('[data-ticket-hint]', { cancelled: '计划有变时，可重新报名', waiting: '名额确认后再出发', pending: '等待组织者确认' }[status]);
    const a = q('[data-ticket-next]');
    if (a) { a.textContent = status === 'cancelled' ? '重新报名' : '查看报名'; a.href = status === 'cancelled' ? 'registration-form.html' : 'credential.html?status=' + status; }
  }
  const credential = q('[data-credential-status]');
  if (credential) {
    const status = params.get('status') || 'approved';
    const labels = { approved: '审核通过', pending: '待审核', waiting: '候补中', checked_in: '已签到', rejected: '未通过', cancelled: '已取消' };
    const messages = { approved: '请向现场管理员出示本页完成签到。', pending: '组织者正在确认资料，审核通过后可出示凭证。', waiting: '本次名额已满，尚未获得有效出发凭证。', checked_in: '现场签到已完成，请按约定骑行。', rejected: '本次报名未通过，请查看意见并修改后重报。', cancelled: '本次报名已取消，需要时可重新报名。' };
    credential.textContent = labels[status] || labels.approved;
    credential.className = ['approved', 'checked_in'].includes(status) ? 'tag success' : 'tag warning';
    text('[data-credential-note]', messages[status] || messages.approved);
    show('[data-credential-active]', ['approved', 'checked_in'].includes(status));
    show('[data-cancel]', ['waiting', 'pending', 'approved'].includes(status));
    if (['pending', 'waiting'].includes(status)) {
      text('[data-credential-heading]', status === 'pending' ? '等一声，出发。' : '等待一个位置。');
      text('.voucher-title', '此里 CILI · 报名记录');
      const number = q('.voucher-number'); if (number) number.hidden = true;
    }
    if (status === 'rejected') {
      const reason = document.createElement('div'); reason.className = 'notice warning';
      reason.textContent = '审核意见：请补充近期骑行经验后重新报名。';
      q('.ticketbody')?.append(reason);
    }
  }
  on('[data-share-activity]', () => toast('微信分享将打开活动详情，仅分享活动信息。'));
  on('[data-tabgroup] [role=tab]', e => {
    const b = e.currentTarget;
    all('[data-tabgroup] [role=tab]').forEach(el => el.setAttribute('aria-selected', String(el === b)));
    const scope = q('[data-activity-results]');
    const source = q(b.dataset.panel === 'history' ? '#history-content' : '#upcoming-content');
    if (scope && source) scope.replaceChildren(...[...source.childNodes].map(node => node.cloneNode(true)));
  });
  on('[data-compact]', e => { const list = q('[data-activity-results]'); list.classList.toggle('compact'); e.currentTarget.setAttribute('aria-pressed', String(list.classList.contains('compact'))); });
  on('[data-filter]', e => {
    const b = e.currentTarget; all('[data-filter]').forEach(el => el.setAttribute('aria-pressed', String(el === b)));
    let shown = 0;
    all('[data-review-state]').forEach(el => { el.hidden = b.dataset.filter !== '全部' && el.dataset.reviewState !== b.dataset.filter; if (!el.hidden) shown++; });
    show('[data-review-empty]', shown === 0);
  });
  const reviewStatus = params.get('status') || 'pending';
  if (q('[data-review-current]')) {
    const samples = {
      lin: ['林见山', '山风', '男', '19900000001', '林小川', '19900000002', '有经验', '希望按自己的节奏爬坡，感谢组织。'],
      chen: ['陈秋原', '松果', '女', '19900000003', '陈小秋', '19900000006', '新手', '首次参加这条路线，请多关照。'],
      zhou: ['周远', '阿远', '男', '19900000004', '周小远', '19900000007', '常骑', '熟悉往返路线，会按约定集合。'],
      xu: ['许小野', '小野', '女', '19900000005', '许小林', '19900000008', '新手', '希望参加本次骑行。']
    };
    const sample = samples[params.get('applicant')] || samples.lin;
    ['name', 'nickname', 'gender', 'phone', 'emergency-name', 'emergency-phone', 'experience', 'remark'].forEach((key, i) => {
      all('[data-review-' + key + ']').forEach(el => { el.textContent = sample[i]; });
    });
    text('[data-review-current]', { pending: '待审核', approved: '审核通过', checked_in: '已签到', rejected: '已驳回', waiting: '候补中' }[reviewStatus] || '待审核');
    show('[data-pending-actions]', reviewStatus === 'pending');
    show('[data-approved-actions]', reviewStatus === 'approved');
    show('[data-checked-actions]', reviewStatus === 'checked_in');
  }
  const finishReview = action => {
    show('[data-review-result]', true);
    text('[data-review-result]', action === 'reject' ? '已驳回 · 意见已保留' : action === 'checkin' ? '已签到 · 报名记录已更新' : '审核通过 · 骑友可查看凭证');
    all('[data-pending-actions],[data-approved-actions]').forEach(el => { el.hidden = true; });
    text('[data-review-current]', action === 'reject' ? '已驳回' : action === 'checkin' ? '已签到' : '审核通过');
    if (action === 'approve') show('[data-approved-actions]', true);
    if (action === 'checkin') show('[data-checked-actions]', true);
  };
  on('[data-review-action]', e => {
    const action = e.currentTarget.dataset.reviewAction, note = q('#review-note');
    if (action === 'reject' && !note?.value.trim()) {
      note.setCustomValidity('请填写驳回原因，便于骑友修改后重报。'); note.reportValidity();
      note.addEventListener('input', () => note.setCustomValidity(''), { once: true }); return;
    }
    if (action === 'checkin') {
      let d = q('#checkin-dialog');
      if (!d) {
        d = document.createElement('dialog'); d.className = 'dialog'; d.id = 'checkin-dialog';
        d.innerHTML = '<h2>确认现场签到？</h2><p>请核对本人及活动后完成签到，签到完成后不可取消报名。</p><div class="buttonpair"><button class="btn secondary" data-checkin-close>暂不签到</button><button class="btn" data-checkin-confirm>确认签到</button></div>';
        document.body.append(d); d.querySelector('[data-checkin-close]').onclick = () => d.close();
        d.querySelector('[data-checkin-confirm]').onclick = () => { d.close(); finishReview('checkin'); };
      }
      d.showModal(); return;
    }
    finishReview(action);
  });
  const prepareRoute = () => {
    routeReady = false; show('[data-route-preparing]', true); lockMedia(1);
    text('[data-route-preparing]', '正在解析并生成路线预览，完成前不能发布。');
    setTimeout(() => {
      routeReady = true; text('[data-route-preparing]', '路线预览已准备好并绑定 · 82 km / 986 m · 本地演示');
      text('[data-route-binding]', '已绑定'); text('#publish-help', '路线预览已绑定，请确认信息后发布。'); lockMedia(-1);
    }, 1000);
  };
  on('[data-gpx]', e => {
    const f = e.currentTarget.files?.[0]; if (!f) return;
    if (!f.name.toLowerCase().endsWith('.gpx') || f.size > 4 * 1024 * 1024) { toast('请选择不超过 4 MB 的 GPX 文件。'); return; }
    prepareRoute();
  }, 'change');
  on('[data-strava-import]', () => {
    const input = q('[data-strava-url]') || q('#strava-url');
    if (!input?.value.trim()) { input?.focus(); toast('请粘贴 Strava 路线地址。'); return; }
    if (!/^https:\/\/(?:www\.)?strava\.com\/routes\/[0-9]+\/?$/.test(input.value.trim())) { toast('请输入有效的 Strava 路线地址。'); return; }
    prepareRoute();
  });
  if (params.has('preparing') && q('[data-publish]')) { show('[data-route-preparing]', true); lockMedia(1); }
  on('[data-save-draft]', () => toast('草稿已保存 · 本地演示'));
  on('[data-notifications]', () => q('#subscription-dialog').showModal());
  on('[data-subscription-choice]', e => {
    q('#subscription-dialog').close(); show('[data-notification-result]', true);
    text('[data-notification-result]', e.currentTarget.dataset.subscriptionChoice === 'accept' ? '已完成本次订阅选择 · 不代表永久开启' : '本次未订阅，仍可在行程中查看报名状态');
  });
  on('[data-privacy]', () => toast('微信正式运行时打开小程序隐私管理。'));
  on('[data-cache-clear]', () => q('#cache-dialog').showModal());
  on('[data-cache-confirm]', () => { q('#cache-dialog').close(); toast('可重建缓存已清理，报名与个人资料保留。'); });
  const stravaState = params.get('strava');
  if (stravaState && q('[data-strava-status]')) {
    text('[data-strava-status]', { connected: '已连接', pending: '等待授权', error: '暂时无法连接' }[stravaState] || '尚未连接');
    text('[data-strava-note]', { connected: '可在活动编辑页粘贴 Strava 路线地址，导入后确认预览。', pending: '在浏览器完成授权后返回这里刷新状态。', error: '请稍后重试；活动编辑仍可手动导入 GPX。' }[stravaState] || '连接后可同步路线。');
    text('[data-strava-auth]', stravaState === 'connected' ? '刷新连接状态' : stravaState === 'pending' ? '刷新连接状态' : '重试连接');
  }
  on('[data-strava-auth]', e => {
    if (stravaState === 'connected') { toast('已刷新连接状态 · 本地演示'); return; }
    text('[data-strava-status]', '等待授权');
    text('[data-strava-note]', '正式运行时复制授权链接，在浏览器完成授权后返回刷新。');
    e.currentTarget.textContent = '刷新连接状态';
    e.currentTarget.onclick = null;
  });
})();

</script></body></html>
