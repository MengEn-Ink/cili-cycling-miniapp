<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>此里 · 双端截图验收 · 2026-10-16</title>
<style>
  :root { color-scheme:light; font:16px/1.65 system-ui,sans-serif; color:#171717; background:#f3f3f1 }
  * { box-sizing:border-box }
  body { max-width:1120px; margin:auto; padding:32px 24px }
  a { color:#a93619; text-underline-offset:4px; overflow-wrap:anywhere }
  h1 { font-size:clamp(26px,5vw,42px); line-height:1.2; margin:12px 0 20px }
  h2 { font-size:23px; margin:0 0 8px; overflow-wrap:anywhere }
  p { max-width:80ch; margin:10px 0 }
  small, figcaption { color:#555; font-size:14px }
  nav { display:flex; flex-wrap:wrap; gap:8px; margin:24px 0 }
  nav a { display:flex; align-items:center; min-height:44px; padding:8px 12px; background:white; border:1px solid #d4d4d4; border-radius:10px }
  section { border-top:1px solid #c9c9c9; padding:28px 0; margin-top:24px; scroll-margin:20px }
  .pair { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; margin-top:20px }
  figure { margin:0; background:white; border:1px solid #d4d4d4; border-radius:14px; overflow:hidden }
  figcaption { padding:12px 16px; border-bottom:1px solid #d4d4d4; font-weight:700 }
  img { width:100%; height:auto; display:block }
  .note { padding:14px 18px; border-left:4px solid #c84320; background:#fff }
  :focus-visible { outline:3px solid #171717; outline-offset:3px }
  @media(max-width:650px) { body { padding:24px 16px } .pair { grid-template-columns:1fr } }
</style>
<header>
  <a href="../../../index.html#test-ia">← 返回研发交付中心</a>
  <p><small>2026-10-16 · 375 × 812 · 微信开发者工具 / Pages</small></p>
  <h1>双端截图与逐页差异</h1>
  <p>左侧为真实云端只读运行，右侧为 Pages 演示样本。灰色区域为不可逆遮盖的个人照片和资料。13 页均留存证据，差异说明记录尚未对齐的状态和布局。</p>
  <p class="note">截图不等于完整验收。普通成员报名、发布成功、审批写入、iOS / Android 物理真机与体验版 UAT 尚未完成。</p>
  <p id="result">正在读取本轮记录…</p>
  <p><a href="runtime-report.json">运行报告 JSON</a> · <a href="redactions.json">脱敏区域</a> · <a href="https://github.com/MengEn-Ink/cili-cycling-miniapp/blob/main/docs/verification/2026-10-16-design-e2e-acceptance.md">完整验收记录</a></p>
</header>
<nav id="routes" aria-label="页面截图索引"></nav>
<main id="comparisons"></main>
<script>
  const text = (tag, value) => {
    const element = document.createElement(tag);
    element.textContent = value;
    return element;
  };
  fetch('runtime-report.json').then(response => {
    if (!response.ok) throw new Error('报告暂不可用');
    return response.json();
  }).then(report => {
    document.querySelector('#result').textContent =
      `客户端 ${report.releaseVersion} · ${report.passed} 项通过 / ${report.failed} 项失败 · ${report.finishedAt}`;
    for (const route of report.screenshots) {
      const section = document.createElement('section');
      section.id = route.id;
      const link = text('a', route.id);
      link.href = '#' + route.id;
      document.querySelector('#routes').append(link);
      section.append(text('h2', route.id), text('small', route.state), text('p', route.note));
      const pair = document.createElement('div');
      pair.className = 'pair';
      for (const [side, label] of [['devtools', '微信运行 · 真实数据（个人区域已遮盖）'], ['pages', 'Pages · 演示样本']]) {
        const figure = document.createElement('figure');
        const img = document.createElement('img');
        img.src = route[side];
        img.alt = route.id + ' · ' + label;
        img.loading = 'lazy';
        img.width = 375;
        img.height = 812;
        figure.append(text('figcaption', label), img);
        pair.append(figure);
      }
      section.append(pair);
      document.querySelector('#comparisons').append(section);
    }
  }).catch(() => {
    document.querySelector('#result').textContent = '验收报告暂不可用，请刷新重试，或使用上方 JSON 链接。';
  });
</script>
</html>
