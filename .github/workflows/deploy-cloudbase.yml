name: CloudBase 自动部署

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_all_functions:
        description: 重新部署 cloudbaserc.json 中的全部云函数
        required: false
        default: false
        type: boolean
      apply_infrastructure:
        description: 执行数据库基线、存储规则 apply / verify
        required: false
        default: false
        type: boolean
      purge_prelaunch_media_data:
        description: 清除预发布个人资料及统一上传历史媒体（不可恢复）
        required: false
        default: false
        type: boolean
      purge_confirmation:
        description: 清理时必须精确填写 DELETE_PRELAUNCH_MEDIA_DATA
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudbase-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: cloudbase-production
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      CLOUDBASE_ENV_ID: ${{ vars.CLOUDBASE_ENV_ID }}
      CLOUDBASE_REGION: ${{ vars.CLOUDBASE_REGION }}
      CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
      PII_ENCRYPTION_KEY_SOURCE: ${{ secrets.PII_ENCRYPTION_KEY }}
      TCB_NO_BROWSER: 'true'
    steps:
      - name: Checkout current main source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2

      - name: Resolve deployment scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_ALL: ${{ inputs.deploy_all_functions }}
          FORCE_INFRASTRUCTURE: ${{ inputs.apply_infrastructure }}
          PURGE_PRELAUNCH_MEDIA_DATA: ${{ inputs.purge_prelaunch_media_data }}
          PURGE_CONFIRMATION: ${{ inputs.purge_confirmation }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --no-tags --unshallow origin main
          else
            git fetch --no-tags origin main
          fi
          current_main="$(git rev-parse origin/main)"
          deployment_head="${TARGET_SHA}"
          export FORCE_RECONCILE=false
          if [[ "${TARGET_SHA}" != "${current_main}" ]]; then
            deployment_head="${current_main}"
            git checkout --detach "${deployment_head}"
            base_sha="$(git rev-parse "${deployment_head}^")"
            export FORCE_RECONCILE=true
            echo "检测到排队期间 main 已推进，改为完整对账并部署最新 main：${deployment_head}"
          else
            mapfile -t successful_runs < <(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-cloudbase.yml/runs?branch=main&status=success&per_page=100" \
              --jq '.workflow_runs[].head_sha')
            base_sha=""
            for successful_sha in "${successful_runs[@]}"; do
              if [[ "${successful_sha}" != "${TARGET_SHA}" ]]; then
                base_sha="${successful_sha}"
                break
              fi
            done
            if [[ -z "${base_sha}" ]] || ! git merge-base --is-ancestor "${base_sha}" "${deployment_head}"; then
              base_sha="$(git rev-parse "${deployment_head}^")"
              export FORCE_RECONCILE=true
              echo "没有可用的上次成功部署基线，执行完整对账"
            else
              echo "按上次成功部署基线计算范围：${base_sha}..${deployment_head}"
            fi
          fi
          node scripts/cloudbase-deploy-decision.mjs \
            --base "${base_sha}" \
            --head "${deployment_head}" \
            --output "${RUNNER_TEMP}/cloudbase-deploy-decision.json"
          node -e '
            const fs = require("node:fs");
            const decision = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const config = JSON.parse(fs.readFileSync("cloudbaserc.json", "utf8"));
            if (process.env.FORCE_RECONCILE === "true") {
              decision.shouldDeploy = true;
              decision.applyInfrastructure = true;
              decision.functions = config.functions.map(({ name }) => name);
            }
            if (process.env.FORCE_ALL === "true") {
              decision.shouldDeploy = true;
              decision.functions = config.functions.map(({ name }) => name);
            }
            if (process.env.FORCE_INFRASTRUCTURE === "true") {
              decision.shouldDeploy = true;
              decision.applyInfrastructure = true;
            }
            if (process.env.PURGE_PRELAUNCH_MEDIA_DATA === "true") {
              if (
                process.env.EVENT_NAME !== "workflow_dispatch" ||
                process.env.PURGE_CONFIRMATION !== "DELETE_PRELAUNCH_MEDIA_DATA"
              ) {
                throw new Error("预发布媒体清理缺少精确人工确认");
              }
              decision.shouldDeploy = true;
              decision.functions = [
                ...new Set([
                  ...(decision.functions || []),
                  "profile",
                  "admin-review",
                  "profile-media-cleanup",
                ]),
              ];
            }
            fs.writeFileSync(process.argv[1], `${JSON.stringify(decision, null, 2)}\n`);
          ' "${RUNNER_TEMP}/cloudbase-deploy-decision.json"
          jq -e '.shouldDeploy | type == "boolean"' "${RUNNER_TEMP}/cloudbase-deploy-decision.json" >/dev/null
          echo "should_deploy=$(jq -r '.shouldDeploy' "${RUNNER_TEMP}/cloudbase-deploy-decision.json")" >> "${GITHUB_OUTPUT}"
          echo "apply_infrastructure=$(jq -r '.applyInfrastructure' "${RUNNER_TEMP}/cloudbase-deploy-decision.json")" >> "${GITHUB_OUTPUT}"
          echo "functions=$(jq -c '.functions' "${RUNNER_TEMP}/cloudbase-deploy-decision.json")" >> "${GITHUB_OUTPUT}"

      - name: Report skipped deployment
        if: steps.scope.outputs.should_deploy != 'true'
        run: echo "本次提交不影响 CloudBase 资源，跳过部署"

      - name: Validate GitHub deployment configuration
        if: steps.scope.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDBASE_API_KEY}" ]] || { echo "缺少 GitHub Environment Secret：CLOUDBASE_API_KEY" >&2; exit 1; }
          [[ -n "${CLOUDBASE_ENV_ID}" ]] || { echo "缺少 GitHub Environment Variable：CLOUDBASE_ENV_ID" >&2; exit 1; }
          [[ -n "${CLOUDBASE_REGION}" ]] || { echo "缺少 GitHub Environment Variable：CLOUDBASE_REGION" >&2; exit 1; }
          [[ -n "${PII_ENCRYPTION_KEY_SOURCE}" ]] || { echo "缺少 GitHub Environment Secret：PII_ENCRYPTION_KEY" >&2; exit 1; }
          configured_env="$(node -p "require('./cloudbaserc.json').envId")"
          [[ "${CLOUDBASE_ENV_ID}" == "${configured_env}" ]] || {
            echo "GitHub Environment 与 cloudbaserc.json 的环境 ID 不一致，拒绝部署" >&2
            exit 1
          }

      - name: Setup Node.js
        if: steps.scope.outputs.should_deploy == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install and verify cloud packages
        if: steps.scope.outputs.should_deploy == 'true'
        run: |
          npm ci
          npm run cloud:install
          npm run test:cloud
          npm run verify:cloud-packages

      - name: Authenticate with environment API Key
        if: steps.scope.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes --package @cloudbase/cli@3.8.4 tcb \
            -e "${CLOUDBASE_ENV_ID}" \
            login --cloudbase-api-key "${CLOUDBASE_API_KEY}" --json

      - name: Resolve, mask, and prepare runtime function config
        if: steps.scope.outputs.should_deploy == 'true'
        env:
          PROFILE_MEDIA_PATH_SECRET_SOURCE: ${{ secrets.PROFILE_MEDIA_PATH_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          details_dir="${RUNNER_TEMP}/cloudbase-function-details-before"
          functions_list="${RUNNER_TEMP}/cloudbase-functions-before.json"
          functions_inventory="${RUNNER_TEMP}/cloudbase-functions-inventory.json"
          runtime_config="${RUNNER_TEMP}/cloudbaserc.runtime.json"
          mkdir -p "${details_dir}"
          npx --yes --package @cloudbase/cli@3.8.4 tcb \
            -e "${CLOUDBASE_ENV_ID}" \
            fn list --json > "${functions_list}"
          node scripts/cloudbase-function-env.mjs inventory \
            --config cloudbaserc.json \
            --list "${functions_list}" \
            --output "${functions_inventory}"
          while IFS= read -r function_name; do
            [[ "${function_name}" =~ ^[a-z][a-z0-9-]*$ ]] || { echo "非法函数名" >&2; exit 1; }
            npx --yes --package @cloudbase/cli@3.8.4 tcb \
              -e "${CLOUDBASE_ENV_ID}" \
              fn detail "${function_name}" --json > "${details_dir}/${function_name}.json"
          done < <(jq -r '.existing[]' "${functions_inventory}")
          node scripts/cloudbase-function-env.mjs prepare \
            --config cloudbaserc.json \
            --decision "${RUNNER_TEMP}/cloudbase-deploy-decision.json" \
            --inventory "${functions_inventory}" \
            --details-dir "${details_dir}" \
            --include-secret-consumers true \
            --output "${runtime_config}"
          cp cloudbaserc.json "${RUNNER_TEMP}/cloudbaserc.repository.json"
          cp "${runtime_config}" cloudbaserc.json
          rm -f "${runtime_config}"

      - name: Plan and apply database baseline
        if: steps.scope.outputs.should_deploy == 'true' && steps.scope.outputs.apply_infrastructure == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bootstrap-cloudbase.mjs \
            --env-id "${CLOUDBASE_ENV_ID}" \
            --region "${CLOUDBASE_REGION}"
          node scripts/bootstrap-cloudbase.mjs \
            --apply \
            --env-id "${CLOUDBASE_ENV_ID}" \
            --region "${CLOUDBASE_REGION}"
          node scripts/bootstrap-cloudbase.mjs \
            --verify \
            --env-id "${CLOUDBASE_ENV_ID}" \
            --region "${CLOUDBASE_REGION}"

      - name: Apply and verify storage security rules
        if: steps.scope.outputs.should_deploy == 'true' && steps.scope.outputs.apply_infrastructure == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run cloudbase:storage:reconcile -- --env-id "${CLOUDBASE_ENV_ID}"

      - name: Deploy affected cloud functions
        if: steps.scope.outputs.should_deploy == 'true'
        env:
          FUNCTIONS_JSON: ${{ steps.scope.outputs.functions }}
        shell: bash
        run: |
          set -euo pipefail
          echo "部署命令使用已安装到工作区的 runner 临时运行时配置"
          mapfile -t planned_functions < <(jq -r '.[]' <<< "${FUNCTIONS_JSON}")
          completed_functions=()
          current_index=0
          report_partial_deployment() {
            exit_code=$?
            echo "云函数部署未全部完成；已完成并验证：${completed_functions[*]:-无}" >&2
            echo "尚未完成（含当前失败项）：${planned_functions[*]:${current_index}}" >&2
            exit "${exit_code}"
          }
          trap report_partial_deployment ERR
          for function_name in "${planned_functions[@]}"; do
            [[ "${function_name}" =~ ^[a-z][a-z0-9-]*$ ]] || { echo "非法函数名" >&2; false; }
            echo "部署并逐项验证云函数：${function_name}"
            npx --yes --package @cloudbase/cli@3.8.4 tcb \
              -e "${CLOUDBASE_ENV_ID}" \
              fn deploy "${function_name}" --force --json
            detail_file="${RUNNER_TEMP}/cloudbase-deployed-${function_name}.json"
            verified=false
            for attempt in $(seq 1 12); do
              npx --yes --package @cloudbase/cli@3.8.4 tcb \
                -e "${CLOUDBASE_ENV_ID}" \
                fn detail "${function_name}" --json > "${detail_file}"
              if node scripts/cloudbase-function-env.mjs verify-one \
                --detail "${detail_file}" \
                --name "${function_name}" 2>/dev/null; then
                verified=true
                break
              fi
              [[ "${attempt}" -eq 12 ]] || sleep 5
            done
            if [[ "${verified}" != 'true' ]]; then
              node scripts/cloudbase-function-env.mjs verify-one \
                --detail "${detail_file}" \
                --name "${function_name}"
            fi
            rm -f "${detail_file}"
            completed_functions+=("${function_name}")
            current_index=$((current_index + 1))
          done
          trap - ERR

      - name: Reconcile critical function secrets
        if: steps.scope.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          details_dir="${RUNNER_TEMP}/cloudbase-function-secret-reconcile"
          mkdir -p "${details_dir}"
          while IFS= read -r function_name; do
            [[ "${function_name}" =~ ^[a-z][a-z0-9-]*$ ]] || { echo "非法函数名" >&2; exit 1; }
            detail_file="${details_dir}/${function_name}.json"
            if npx --yes --package @cloudbase/cli@3.8.4 tcb \
              -e "${CLOUDBASE_ENV_ID}" \
              fn detail "${function_name}" --json > "${detail_file}" && \
              node scripts/cloudbase-function-env.mjs verify-one \
                --detail "${detail_file}" \
                --name "${function_name}" 2>/dev/null; then
              echo "关键密钥已对账：${function_name}"
              continue
            fi

            echo "检测到关键密钥缺失或漂移，使用 runner 临时运行时配置仅重部署：${function_name}"
            npx --yes --package @cloudbase/cli@3.8.4 tcb \
              -e "${CLOUDBASE_ENV_ID}" \
              fn deploy "${function_name}" --force --json
            verified=false
            for attempt in $(seq 1 12); do
              if npx --yes --package @cloudbase/cli@3.8.4 tcb \
                -e "${CLOUDBASE_ENV_ID}" \
                fn detail "${function_name}" --json > "${detail_file}" && \
                node scripts/cloudbase-function-env.mjs verify-one \
                  --detail "${detail_file}" \
                  --name "${function_name}" 2>/dev/null; then
                verified=true
                break
              fi
              [[ "${attempt}" -eq 12 ]] || sleep 5
            done
            if [[ "${verified}" != 'true' ]]; then
              node scripts/cloudbase-function-env.mjs verify-one \
                --detail "${detail_file}" \
                --name "${function_name}"
            fi
          done < <(printf '%s\n' \
            profile \
            profile-media-cleanup \
            admin-review \
            activity-read \
            activity-admin \
            club-application)

      - name: Verify deployed environment and media secret consistency
        if: steps.scope.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          details_dir="${RUNNER_TEMP}/cloudbase-function-details-after"
          mkdir -p "${details_dir}"
          while IFS= read -r function_name; do
            [[ "${function_name}" =~ ^[a-z][a-z0-9-]*$ ]] || { echo "非法函数名" >&2; exit 1; }
            npx --yes --package @cloudbase/cli@3.8.4 tcb \
              -e "${CLOUDBASE_ENV_ID}" \
              fn detail "${function_name}" --json > "${details_dir}/${function_name}.json"
          done < <(printf '%s\n' \
            profile \
            profile-media-cleanup \
            admin-review \
            activity-read \
            activity-admin \
            club-application)
          node scripts/cloudbase-function-env.mjs verify \
            --config "${RUNNER_TEMP}/cloudbaserc.repository.json" \
            --details-dir "${details_dir}"
          echo "CloudBase 部署验证通过：环境 ${CLOUDBASE_ENV_ID}"

      - name: Purge explicitly confirmed prelaunch media data
        if: >-
          steps.scope.outputs.should_deploy == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.purge_prelaunch_media_data == true &&
          inputs.purge_confirmation == 'DELETE_PRELAUNCH_MEDIA_DATA'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudbase-prelaunch-media-purge.mjs \
            --apply \
            --env-id "${CLOUDBASE_ENV_ID}" \
            --confirm-env-id "${CLOUDBASE_ENV_ID}" \
            --confirmation DELETE_PRELAUNCH_MEDIA_DATA

      - name: Run production club application write smoke
        if: steps.scope.outputs.should_deploy == 'true'
        env:
          CILI_ALLOW_PRODUCTION_SMOKE: club-application-write
          CILI_SMOKE_ENV_ID: ${{ vars.CLOUDBASE_ENV_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npm run cloudbase:smoke:club-application -- \
            --env-id "${CLOUDBASE_ENV_ID}" \
            --confirm-env-id "${CLOUDBASE_ENV_ID}" \
            --run-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Restore repository config and clear runtime secret files
        if: always() && steps.scope.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -uo pipefail
          cleanup_status=0
          if [[ -f "${RUNNER_TEMP}/cloudbaserc.repository.json" ]]; then
            cp "${RUNNER_TEMP}/cloudbaserc.repository.json" cloudbaserc.json || cleanup_status=$?
          fi
          rm -rf \
            "${RUNNER_TEMP}/cloudbaserc.runtime.json" \
            "${RUNNER_TEMP}/cloudbaserc.repository.json" \
            "${RUNNER_TEMP}/cloudbase-functions-before.json" \
            "${RUNNER_TEMP}/cloudbase-functions-inventory.json" \
            "${RUNNER_TEMP}/cloudbase-function-details-before" \
            "${RUNNER_TEMP}/cloudbase-function-details-after" \
            "${RUNNER_TEMP}/cloudbase-function-secret-reconcile" \
            "${RUNNER_TEMP}"/cloudbase-deployed-*.json || cleanup_status=$?
          exit "${cleanup_status}"

      - name: Clear temporary login state
        if: always() && steps.scope.outputs.should_deploy == 'true'
        continue-on-error: true
        run: npx --yes --package @cloudbase/cli@3.8.4 tcb logout --json
