name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled]

permissions:
  contents: read
  actions: read

# 描述/标签更新只取消旧 metadata 检查，不取消仍在执行的源码检查；main 不取消。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.action == 'edited' || github.event.action == 'labeled') && 'metadata' || 'source' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-submission:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      !(github.actor == 'github-actions[bot]' && startsWith(github.head_ref, 'fix/nightly-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate pull request submission
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run check:pr-description

  upload-decision:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute miniprogram upload decision
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
        run: >-
          node scripts/miniprogram-upload-decision.mjs create
          --before "${BEFORE_SHA}"
          --sha "${TARGET_SHA}"
          --output "${RUNNER_TEMP}/miniprogram-upload-decision.json"
      - name: Publish miniprogram upload decision
        uses: actions/upload-artifact@v7
        with:
          name: miniprogram-upload-decision
          path: ${{ runner.temp }}/miniprogram-upload-decision.json
          if-no-files-found: error
          retention-days: 1

  affected-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_ACTION: ${{ github.event.action }}
      PR_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/miniprogram-ci/package-lock.json
            cloudfunctions/*/package-lock.json
      - name: Resolve trusted source evidence
        id: evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-source-evidence.mjs prepare
      - name: Install root dependencies
        if: steps.evidence.outputs.reuse != 'true'
        run: npm ci
      - name: Run affected pull request checks through Harness
        if: steps.evidence.outputs.reuse != 'true'
        env:
          AFFECTED_BASE: ${{ github.event.pull_request.base.sha }}
          AFFECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          RELEASE_NOTES_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run harness -- run affected
      - name: Create successful source evidence
        if: success() && steps.evidence.outputs.reuse != 'true' && github.event.action != 'edited' && github.event.action != 'labeled'
        run: node scripts/pr-source-evidence.mjs create
      - name: Store successful source evidence
        if: success() && steps.evidence.outputs.reuse != 'true' && github.event.action != 'edited' && github.event.action != 'labeled'
        uses: actions/upload-artifact@v7
        with:
          name: pr-source-evidence-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-source-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Upload Harness report
        if: always() && steps.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: harness-report-${{ github.event.pull_request.number }}
          path: artifacts/harness/harness-report.json
          if-no-files-found: error
          retention-days: 14

  validate:
    if: always() && github.event_name == 'pull_request'
    needs: [pr-submission, affected-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate required pull request checks
        env:
          PR_SUBMISSION_RESULT: ${{ needs.pr-submission.result }}
          AFFECTED_PR_RESULT: ${{ needs.affected-pr.result }}
          SUBMISSION_EXEMPT: ${{ github.actor == 'dependabot[bot]' || (github.actor == 'github-actions[bot]' && startsWith(github.head_ref, 'fix/nightly-')) }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${AFFECTED_PR_RESULT}" != "success" ]]; then
            echo "affected-pr 必须成功，实际为 ${AFFECTED_PR_RESULT}" >&2
            exit 1
          fi
          if [[ "${PR_SUBMISSION_RESULT}" == "success" ]]; then
            exit 0
          fi
          if [[ "${SUBMISSION_EXEMPT}" == "true" && "${PR_SUBMISSION_RESULT}" == "skipped" ]]; then
            echo "机器人 PR 允许 pr-submission skipped；affected-pr 已成功"
            exit 0
          fi
          echo "pr-submission 必须成功；仅 Dependabot/夜间机器人允许 skipped，实际为 ${PR_SUBMISSION_RESULT}" >&2
          exit 1

  main-validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/miniprogram-ci/package-lock.json
            cloudfunctions/*/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Rebuild shared package and install every cloud function
        run: npm run cloud:install
      - name: Validate main through Harness
        env:
          RELEASE_NOTES_BASE: ${{ github.event.before }}
        run: npm run harness -- run validate --report artifacts/harness/main-validate.json
      - name: Upload main validate Harness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-report-main-validate-${{ github.run_id }}
          path: artifacts/harness/main-validate.json
          if-no-files-found: error
          retention-days: 14

  main-coverage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Run main coverage through Harness
        run: npm run harness -- run coverage --report artifacts/harness/main-coverage.json
      - name: Upload main coverage Harness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-report-main-coverage-${{ github.run_id }}
          path: artifacts/harness/main-coverage.json
          if-no-files-found: error
          retention-days: 14

  main-audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/miniprogram-ci/package-lock.json
            cloudfunctions/*/package-lock.json
      - name: Install isolated dependency trees
        run: |
          npm ci
          npm run tool:install
          npm run cloud:install
      - name: Audit main high-severity vulnerabilities through Harness
        run: npm run harness -- run audit --report artifacts/harness/main-audit.json
      - name: Upload main audit Harness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-report-main-audit-${{ github.run_id }}
          path: artifacts/harness/main-audit.json
          if-no-files-found: error
          retention-days: 14
