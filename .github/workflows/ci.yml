name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute miniprogram upload decision
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
        run: >-
          node scripts/miniprogram-upload-decision.mjs create
          --before "${BEFORE_SHA}"
          --sha "${TARGET_SHA}"
          --output "${RUNNER_TEMP}/miniprogram-upload-decision.json"
      - name: Publish miniprogram upload decision
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: miniprogram-upload-decision
          path: ${{ runner.temp }}/miniprogram-upload-decision.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudfunctions/shared/package-lock.json
            cloudfunctions/auth/package-lock.json
            cloudfunctions/activity-read/package-lock.json
            cloudfunctions/registration/package-lock.json
            cloudfunctions/admin-review/package-lock.json
            cloudfunctions/profile/package-lock.json
            cloudfunctions/strava-auth/package-lock.json
            cloudfunctions/strava-callback/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Rebuild shared package and install every cloud function
        run: npm run cloud:install
      - name: Validate
        env:
          RELEASE_NOTES_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run validate
      - name: Run tests with coverage
        run: npm run coverage
      - name: Verify CloudBase bootstrap is read-only by default
        run: npm run test:bootstrap
      - name: Audit high-severity vulnerabilities
        run: npm run audit:all
