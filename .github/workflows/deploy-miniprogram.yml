name: 微信开发版自动上传

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 可选版本号；留空时按运行编号生成
        required: false
        type: string
      description:
        description: 可选版本说明
        required: false
        type: string
      robot:
        description: 微信 CI 机器人编号（1-30）
        required: false
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: wechat-development-upload
  cancel-in-progress: false

jobs:
  upload:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECKOUT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_SHA }}

      - name: Ensure automatic upload still targets current main
        id: main-tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [[ "${CHECKOUT_SHA}" == "${CURRENT_MAIN}" ]]; then
            echo "should_upload=true" >> "${GITHUB_OUTPUT}"
          else
            echo "should_upload=false" >> "${GITHUB_OUTPUT}"
            echo "跳过旧版 CI 重跑：${CHECKOUT_SHA} 已不是当前 main ${CURRENT_MAIN}"
          fi

      - name: Setup Node.js
        if: steps.main-tip.outputs.should_upload == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/miniprogram-ci/package-lock.json

      - name: Install locked WeChat upload client
        if: steps.main-tip.outputs.should_upload == 'true'
        run: npm ci --ignore-scripts --prefix tools/miniprogram-ci

      - name: Verify upload script
        if: steps.main-tip.outputs.should_upload == 'true'
        run: npm run test:deploy

      - name: Prepare temporary upload credential
        if: steps.main-tip.outputs.should_upload == 'true'
        env:
          PRIVATE_KEY: ${{ secrets.WECHAT_MINIPROGRAM_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PRIVATE_KEY}" ]]; then
            echo "缺少 GitHub Secret：WECHAT_MINIPROGRAM_PRIVATE_KEY" >&2
            exit 1
          fi
          umask 077
          printf '%s' "${PRIVATE_KEY}" > "${RUNNER_TEMP}/miniprogram-ci.key"

      - name: Upload WeChat development version
        if: steps.main-tip.outputs.should_upload == 'true'
        env:
          MINIPROGRAM_CI_PRIVATE_KEY_PATH: ${{ runner.temp }}/miniprogram-ci.key
          MINIPROGRAM_VERSION: ${{ inputs.version || format('0.0.{0}.{1}', github.run_number, github.run_attempt) }}
          MINIPROGRAM_DESCRIPTION: ${{ inputs.description || format('main {0} · GitHub Actions 自动上传', env.CHECKOUT_SHA) }}
          MINIPROGRAM_CI_ROBOT: ${{ inputs.robot || '1' }}
        shell: bash
        run: |
          set -euo pipefail
          # 依赖安装和自测期间 main 仍可能前进；真正上传前再次缩小竞态窗口。
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "${CHECKOUT_SHA}" != "${CURRENT_MAIN}" ]]; then
            echo "跳过过期提交：${CHECKOUT_SHA} 已不是当前 main ${CURRENT_MAIN}"
            exit 0
          fi
          npm run deploy:miniprogram

      - name: Remove temporary private key
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/miniprogram-ci.key"
