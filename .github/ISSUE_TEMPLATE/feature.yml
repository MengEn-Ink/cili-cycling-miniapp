name: 功能建议
description: 提议可验收的产品、工程或文档改进
title: '[Feature] '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明谁在什么场景遇到什么问题，不要只描述想要的实现。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果与验收标准
      description: 请尽量写成可观察、可验证的结果。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 小程序页面与交互
        - 活动、报名与通知
        - 骑行名片与个人资料
        - 路线与 GPX
        - CloudBase / 云函数
        - GitHub Pages / 文档
        - CI、发布与仓库治理
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可填写候选方案、参考产品、约束或不应改变的现有行为。
  - type: textarea
    id: risks
    attributes:
      label: 风险与兼容性
      description: 是否涉及数据迁移、权限、隐私、云函数、发布流程或历史版本兼容。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和文档，确认没有等价需求。
          required: true
        - label: 我没有在内容中提交凭证、真实用户资料或其他敏感信息。
          required: true
